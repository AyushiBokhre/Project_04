version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: p04
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  webapp:
    build: .
    container_name: project-04
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mysql_data: